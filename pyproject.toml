[project]
name = "voxmate"
version = "0.1.0"
description = "Cross-device voice assistant powered by VOICEVOX, mlx-whisper, and agy"
authors = [
    { name = "Naruto-Takahashi", email = "t.naruto7610@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "mlx-whisper>=0.4.3",
    "pillow>=13.0.0",
    "psd-tools>=1.27.0",
    "python-multipart>=0.0.34",
    "silero-vad>=6.3",
    "uvicorn>=0.54.0",
    "websockets>=17.4",
]

[project.scripts]
voxmate = "voxmate:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
