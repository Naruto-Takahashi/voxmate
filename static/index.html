<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0D1117" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>VoxMate</title>
  <style>
    :root {
      --accent: #74D969;
      --accent-soft: rgba(116, 217, 105, 0.22);
      --accent-dim: rgba(116, 217, 105, 0.12);
      --bg: #0D1117;
      --panel: rgba(22, 28, 38, 0.72);
      --surface: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.1);
      --text: #F2F6FA;
      --muted: #8E9CAD;
      --rec: #FF5C5C;
      --think: #F5B841;
    }

    body.night {
      --bg: #05070A;
      --panel: rgba(10, 13, 18, 0.85);
      --surface: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.06);
      --text: #AAB6C4;
      --muted: #5C6876;
    }

    body.night .portrait-img {
      filter: brightness(0.7) drop-shadow(0 14px 28px rgba(0, 0, 0, 0.75));
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Sans JP", -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
    }

    /* PC ブラウザでの Echo Show 5 (960x480 / 2:1) 実機比率プレビュー枠 */
    body.preview-frame {
      background: #050709;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    body.preview-frame .device-shell {
      position: relative;
      width: 788px;
      height: 394px;
      max-width: 96vw;
      aspect-ratio: 2 / 1;
      border-radius: 16px;
      overflow: hidden;
      border: 6px solid #202731;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.08);
      transform: translateZ(0);
    }

    body:not(.preview-frame) .device-shell {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .preview-caption {
      display: none;
      font-size: 12px;
      color: #7D8B9B;
      letter-spacing: 0.04em;
    }

    body.preview-frame .preview-caption {
      display: block;
    }

    /* スタジオ背景 */
    .stage-bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 80% 48%, var(--accent-soft) 0%, transparent 52%),
        radial-gradient(circle at 12% 10%, rgba(255, 255, 255, 0.035) 0%, transparent 45%),
        var(--bg);
      transition: background 0.35s ease;
      z-index: 0;
    }

    /* メイン 62:38 左右分割レイアウト */
    .layout {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: 62% 38%;
    }

    /* ========== 左ペイン（62%）：時計 ＋ 広々会話エリア ========== */
    .left-pane {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 14px 10px 14px 20px;
      min-width: 0;
      min-height: 0;
      cursor: default;
    }

    /* 上段：大きな時計 ＋ ユーティリティボタン */
    .left-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      cursor: default;
    }

    .clock-wrap {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .clock-time {
      font-size: 34px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      line-height: 1;
      color: var(--text);
    }

    .clock-date {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
    }

    .header-tools {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tool-btn {
      height: 34px;
      padding: 0 8px;
      border-radius: 50%;
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      touch-action: manipulation;
      transition: color 0.15s, background 0.15s, transform 0.1s;
    }

    .tool-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.08);
    }

    .tool-btn.icon-only {
      width: 34px;
      padding: 0;
      font-size: 16px;
    }

    .tool-btn:active { transform: scale(0.94); }

    /* 中〜下段全体：広々とした会話・字幕エリア */
    .dialogue-area {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 10px;
      padding: 16px 4px 4px;
      overflow: hidden;
    }

    .speaker-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }

    .speaker-id {
      display: inline-flex;
      align-items: baseline;
      gap: 8px;
    }

    .speaker-name {
      font-size: 16px;
      font-weight: 800;
      color: var(--accent);
    }

    .speaker-style {
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
    }

    .meta-badge {
      font-size: 11px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .chat-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 2px 6px 4px 0;
    }

    .chat-scroll::-webkit-scrollbar { width: 3px; }
    .chat-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.18); border-radius: 3px; }

    .chat-feed {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chat-bubble {
      max-width: 88%;
      padding: 9px 13px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 500;
      line-height: 1.5;
      color: var(--text);
      word-break: break-word;
    }

    .chat-bubble.user {
      align-self: flex-end;
      background: #1D2838;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-bottom-right-radius: 5px;
      font-size: 14.5px;
    }

    .chat-bubble.ai {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-bottom-left-radius: 5px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .chat-bubble.ai:hover {
      background: rgba(255, 255, 255, 0.09);
    }
    .chat-bubble.ai.is-playing {
      border-color: var(--accent);
    }

    @keyframes bubbleIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .chat-bubble.bubble-enter {
      animation: bubbleIn 0.18s ease-out;
    }

    .bubble-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 4px;
    }
    .bubble-copy {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      padding: 2px 4px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      opacity: 0.72;
      transition: opacity 0.15s, color 0.15s, background 0.15s;
    }
    .bubble-copy:hover {
      opacity: 1;
      color: var(--text);
      background: rgba(255, 255, 255, 0.08);
    }
    .bubble-copy.copied {
      color: var(--accent);
      opacity: 1;
    }

    /* コンパクトな丸型マイクアイコンボタン */
    .talk-btn {
      position: absolute;
      left: calc(62% - 54px);
      bottom: 14px;
      z-index: 12;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1.5px solid var(--accent);
      background: rgba(13, 17, 23, 0.82);
      backdrop-filter: blur(12px);
      color: var(--text);
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
      transition: background 0.18s, border-color 0.18s, transform 0.1s;
    }

    .talk-btn:active { transform: scale(0.95); }

    body.mode-recording .talk-btn {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }

    body.mode-thinking .talk-btn {
      border-color: var(--think);
      background: rgba(245, 184, 65, 0.18);
      color: var(--think);
    }

    body.mode-speaking .talk-btn {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }

    .talk-left {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 700;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }
    body.mode-recording .status-dot { background: var(--rec); }
    body.mode-thinking .status-dot { background: var(--think); }

    /* 音量波形 */
    .wave {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 20px;
    }

    .wave-bar {
      width: 3.5px;
      height: 5px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.35);
      transition: height 0.08s linear, background 0.2s;
    }

    body.mode-recording .wave-bar { background: var(--rec); }
    body.mode-speaking .wave-bar { background: var(--accent); }

    body.mode-thinking .wave-bar {
      background: var(--think);
      animation: speakWave 0.72s infinite alternate ease-in-out;
    }
    body.mode-thinking .wave-bar:nth-child(2) { animation-delay: 0.14s; }
    body.mode-thinking .wave-bar:nth-child(3) { animation-delay: 0.28s; }
    body.mode-thinking .wave-bar:nth-child(4) { animation-delay: 0.42s; }
    body.mode-thinking .wave-bar:nth-child(5) { animation-delay: 0.56s; }

    @keyframes speakWave {
      0% { height: 4px; }
      100% { height: 18px; }
    }

    .end-btn {
      height: 100%;
      padding: 0 16px;
      border-radius: 14px;
      border: 1px solid rgba(255, 92, 92, 0.45);
      background: rgba(255, 92, 92, 0.14);
      color: #FF8A8A;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      display: none;
      transition: background 0.15s, transform 0.1s;
    }

    body.in-call .end-btn { display: inline-flex; align-items: center; justify-content: center; }
    .end-btn:active { transform: scale(0.95); }

    body.mode-listening .talk-btn {
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    /* ========== 右ペイン（40%）：フルハイト立ち絵ステージ ========== */
    .right-pane {
      position: relative;
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
    }

    .portrait-img {
      position: relative;
      height: 108%;
      max-width: 96%;
      bottom: -10%;
      object-fit: contain;
      object-position: bottom center;
      filter: drop-shadow(0 12px 26px rgba(0, 0, 0, 0.55));
      transition: opacity 0.2s ease, transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), filter 0.25s ease;
      transform-origin: bottom center;
      pointer-events: none;
      animation: gentleBreath 3.8s infinite ease-in-out;
    }

    @keyframes gentleBreath {
      0%, 100% { transform: scale(1, 1) translateY(0); }
      50% { transform: scale(0.996, 1.007) translateY(-1px); }
    }

    body.mode-thinking .portrait-img {
      animation: none;
      transform: rotate(-1.5deg);
    }

    .portrait-img.anim-hop {
      animation: happyHop 0.56s cubic-bezier(0.22, 1, 0.36, 1) !important;
    }

    @keyframes happyHop {
      0% { transform: translateY(0) scale(1, 1); }
      18% { transform: translateY(2px) scale(1.012, 0.988); }
      50% { transform: translateY(-5px) scale(0.992, 1.014); }
      78% { transform: translateY(1.5px) scale(1.008, 0.993); }
      100% { transform: translateY(0) scale(1, 1); }
    }

    .portrait-img.anim-nod {
      animation: listenNod 0.36s ease-in-out !important;
    }

    @keyframes listenNod {
      0% { transform: translateY(0) scale(1, 1); }
      45% { transform: translateY(3px) scale(1.006, 0.994); }
      100% { transform: translateY(0) scale(1, 1); }
    }

    .portrait-img.anim-playful {
      animation: playfulTilt 0.54s cubic-bezier(0.22, 1, 0.36, 1) !important;
    }

    @keyframes playfulTilt {
      0% { transform: translateY(0) rotate(0deg); }
      35% { transform: translateY(-4px) rotate(1.6deg); }
      72% { transform: translateY(1px) rotate(-0.8deg); }
      100% { transform: translateY(0) rotate(0deg); }
    }

    .portrait-img.anim-shy {
      animation: shySway 0.72s ease-in-out !important;
    }

    @keyframes shySway {
      0%, 100% { transform: rotate(0deg); }
      30% { transform: rotate(-1.3deg) translateY(1px); }
      70% { transform: rotate(1.1deg) translateY(0.5px); }
    }

    .portrait-img.anim-droop {
      animation: sadDroop 0.78s ease-in-out !important;
    }

    @keyframes sadDroop {
      0%, 100% { transform: translateY(0) scale(1, 1); }
      45% { transform: translateY(4px) scale(1.006, 0.992); }
    }

    .portrait-img.anim-shake {
      animation: angryShake 0.38s ease-in-out !important;
    }

    @keyframes angryShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-2px); }
      55% { transform: translateX(2px); }
      80% { transform: translateX(-1px); }
    }

    body.mode-recording .portrait-img {
      animation: none;
      transform: rotate(1.3deg) translateY(-1px);
      filter: drop-shadow(0 0 16px var(--accent-soft)) drop-shadow(0 12px 26px rgba(0, 0, 0, 0.55));
    }

    /* オーバーレイシート（設定＆履歴） */
    .backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.62);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 30;
    }
    .backdrop.open { opacity: 1; pointer-events: auto; }

    .sheet {
      position: absolute;
      top: max(10px, env(safe-area-inset-top));
      right: 10px;
      bottom: max(10px, env(safe-area-inset-bottom));
      width: 390px;
      max-width: calc(100% - 20px);
      background: #141B24;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      transform: translateX(110%);
      transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 40;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
    }
    .sheet.open { transform: translateX(0); }

    .sheet-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 16px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .char-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .char-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1.5px solid transparent;
      border-radius: 12px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      text-align: left;
      color: var(--text);
    }

    .char-card.selected {
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.1);
    }

    .char-card img {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      background: #1B232E;
      flex-shrink: 0;
    }

    .char-card-name { font-size: 13px; font-weight: 700; line-height: 1.2; }
    .char-card-style { font-size: 10px; color: var(--muted); }

    .setting-block { display: flex; flex-direction: column; gap: 6px; }
    .setting-label { font-size: 12px; color: var(--muted); font-weight: 600; display: flex; justify-content: space-between; }

    select.setting-select {
      width: 100%;
      background: #1D2734;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 10px;
      font-size: 13px;
      font-family: inherit;
    }

    input[type="range"] { width: 100%; accent-color: var(--accent); height: 22px; }

    .row-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1D2734;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .hist-item {
      padding: 9px 12px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.45;
    }
    .hist-item.user { background: #1D2734; align-self: flex-end; max-width: 90%; }
    .hist-item.ai { background: rgba(255, 255, 255, 0.06); border-left: 3px solid var(--accent); align-self: flex-start; max-width: 95%; }

    /* スリムな統合コンポーザーバー（案1） */
    .text-bar {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      margin-top: 8px;
      padding: 4px 4px 4px 14px;
      border-radius: 22px;
      border: 1px solid var(--border);
      background: rgba(15, 20, 28, 0.84);
      flex-shrink: 0;
      cursor: default;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .text-bar:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-dim);
    }

    .text-input {
      flex: 1;
      min-width: 0;
      min-height: 36px;
      max-height: 112px;
      padding: 7px 0;
      border: none;
      background: transparent;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      line-height: 1.45;
      resize: none;
      overflow-y: auto;
      outline: none;
    }
    .text-input::placeholder { color: var(--muted); }

    .text-send {
      width: 36px;
      height: 36px;
      padding: 0;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: #0B1220;
      cursor: pointer;
      flex-shrink: 0;
      display: none;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }
    .text-send:active { transform: scale(0.96); }
    .text-bar.has-text .text-send { display: inline-flex; }
    .text-bar.has-text .text-mic-btn { display: none; }

    .text-mic-btn {
      width: 36px;
      height: 36px;
      padding: 0;
      border-radius: 50%;
      border: 1px solid var(--accent);
      background: var(--accent-dim);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      touch-action: manipulation;
      transition: background 0.18s, border-color 0.18s, color 0.18s, transform 0.1s;
    }
    .text-mic-btn:active { transform: scale(0.94); }

    body.mode-recording .text-mic-btn {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }
    body.mode-thinking .text-mic-btn {
      border-color: var(--think);
      background: rgba(245, 184, 65, 0.18);
      color: var(--think);
    }
    body.mode-speaking .text-mic-btn {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }

    .cancel-btn {
      width: 34px;
      height: 34px;
      padding: 0;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.08);
      color: var(--muted);
      font-size: 13px;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      touch-action: manipulation;
      transition: color 0.15s, background 0.15s, transform 0.1s;
    }
    .cancel-btn:hover { color: var(--text); background: rgba(255, 255, 255, 0.15); }
    .cancel-btn:active { transform: scale(0.94); }
    body.mode-recording .text-bar .cancel-btn,
    body.mode-thinking .text-bar .cancel-btn { display: inline-flex; }
    .text-bar.has-text .cancel-btn { display: none !important; }

    .float-cancel {
      position: absolute;
      left: calc(62% - 96px);
      bottom: 17px;
      z-index: 12;
      background: rgba(13, 17, 23, 0.85);
      backdrop-filter: blur(10px);
    }

    /* スマホ・PCでは統合バー内に「話す」を収めるためフローティングボタンを隠す */
    .talk-btn { display: none; }
    .float-cancel { display: none; }
    .kbd-toggle { display: none; }

    /* Echo Show 5 等の小型横長画面では左ペイン右下にコンパクトなマイクアイコン配置 */
    @media (max-width: 820px) and (max-height: 430px) {
      .talk-btn { display: inline-flex; }
      body.mode-recording .float-cancel,

    const prefs = {

    function applyHandsfreeUi() {

      muteBtn.innerHTML = prefs.silent
        ? `<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>`
        : `<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>`;

    muteBtn.addEventListener("click", () => {
      prefs.silent = !prefs.silent;
      localStorage.setItem("silent", prefs.silent ? "1" : "0");

    let speakersList = [];
    let modelsList = [];
    let historyItems = [];
    let hasChatted = false;

    // 状態: "idle" | "recording" | "thinking" | "speaking"
    let callState = "idle";

    let audioCtx = null;
    let micAnalyser = null;
    let meterRaf = null;
    let mediaRecorder = null;
    let recChunks = [];
    let abortCtrl = null;
    let playAnalyser = null;
    let playGain = null;
    let lipSyncRaf = null;
    let activeSources = [];
    let lastReplyAudios = [];
    let playChain = Promise.resolve();
    let replyAcc = "";

    // 優しい効果音 & 目覚ましアラーム音（Web Audio API 合成）
    function playChime(kind, boost = false) {
      if (!audioCtx) return;
      try {
        if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
        const now = audioCtx.currentTime;
        const isAlarm = kind === "alarm";
        const notes = kind === "start" ? [523.25, 659.25] :
                      kind === "commit" ? [783.99] :
                      kind === "end" ? [659.25, 440.0] :
                      isAlarm ? [880.0, 1046.5, 1318.5, 1046.5, 880.0, 1046.5] : [];
        const peak = (isAlarm && boost)
          ? Math.min(1.0, 0.75 * prefs.alarmVolume)
          : Math.min(0.6, 0.22 * prefs.volume);
        const step = isAlarm ? 0.12 : 0.08;
        const dur = isAlarm ? 0.16 : 0.14;
        notes.forEach((freq, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = isAlarm ? "triangle" : "sine";
          osc.frequency.setValueAtTime(freq, now + i * step);
          gain.gain.setValueAtTime(0.001, now + i * step);
          gain.gain.exponentialRampToValueAtTime(peak, now + i * step + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * step + dur);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + i * step);
          osc.stop(now + i * step + dur + 0.02);
        });
      } catch (_) {}
    }

    function setExpression(expr, keepHold = false) {
      if (!keepHold && exprHoldTimer) {
        clearTimeout(exprHoldTimer);
        exprHoldTimer = null;
      }
      if (!exprUrls[expr] || currentExpr === expr) return;
      currentExpr = expr;
      portraitImg.src = exprUrls[expr];
    }

    function holdExpression(expr, durationMs = 1600) {
      if (exprHoldTimer) {
        clearTimeout(exprHoldTimer);
        exprHoldTimer = null;
      }
      setExpression(expr, true);
      exprHoldTimer = setTimeout(() => {
        exprHoldTimer = null;
        if (callState === "idle" || callState === "listening") {
          setExpression("idle", true);
        }
      }, durationMs);
    }

    function pickExpressionForText(text) {
      const t = String(text || "");
      if (!t) return "speak";
      if (/(だめ|ダメ|禁止|コラッ|こらっ|許さ|やめろ|怒|警告)/.test(t)) return "angry";
      if (/(悲し|寂し|つら|泣|しょんぼり|がっかり|残念)/.test(t)) return "sad";
      if (/(ガーン|ショック|青ざめ|やばい|ヤバい|大変|ピンチ|まずい)/.test(t)) return "pale";
      if (/(てへぺろ|冗談|なんちゃって|ひみつ|秘密|おちゃめ|イタズラ|いたずら|ドヤ)/.test(t)) return "playful";
      if (/(ありがと|感謝|照れ|てへ|えへ|好き|大好き|はずかし|恥ずかし|褒め|うれし|嬉し)/.test(t)) return "shy";
      if (/(えっ|えぇ|驚|びっくり|ビックリ|まさか|なんと！|時間です|お知らせ|おおっ)/.test(t)) return "surprised";
      if (/(ごめん|すみません|申し訳|失敗|しっぱい|エラー|できませ|できない|出来ませ|出来ない|見つかり|わから|分から|困|キャンセル|中止|無理|ないみたい|お待たせ|難しい|ちょっと待って)/.test(t)) return "troubled";
      if (/[！!♪♫]|楽し|最高|わーい|おやすみ|おはよう|やった|おめでと|ばっちり|いいです/.test(t)) return "happy";

    function scheduleBlink() {
      if (blinkTimer) clearTimeout(blinkTimer);
      const wait = 3000 + Math.random() * 3200;
      blinkTimer = setTimeout(() => {
        if ((callState === "idle" || callState === "listening") && currentExpr === "idle") {
          setExpression("blink");
          setTimeout(() => {
            if ((callState === "idle" || callState === "listening") && currentExpr === "blink") {
              setExpression("idle");
              if (Math.random() < 0.15) {
                setTimeout(() => {
                  if ((callState === "idle" || callState === "listening") && currentExpr === "idle") {
                    setExpression("blink");
                    setTimeout(() => {
                      if (currentExpr === "blink") setExpression("idle");
                    }, 95);
                  }
                }, 130);
              }
            }
          }, 95);
        }
        scheduleBlink();
      }, wait);
    }

      setTimeout(() => {

    let audioUnlocked = false;

    function unlockAudio() {
      try {
        if (!audioCtx) {

        if (audioCtx.state === "suspended") {

    function extractWavEnvelope(wavBytes, fps = 30) {
      try {
        const dv = new DataView(wavBytes.buffer, wavBytes.byteOffset, wavBytes.byteLength);
        const sampleRate = dv.getUint32(24, true) || 24000;
        const channels = dv.getUint16(22, true) || 1;
        // "data" チャンクを探す
        let off = 12;
        let dataOff = 44;
        let dataLen = wavBytes.byteLength - 44;
        while (off + 8 <= wavBytes.byteLength) {
          const id = String.fromCharCode(wavBytes[off], wavBytes[off + 1], wavBytes[off + 2], wavBytes[off + 3]);
          const sz = dv.getUint32(off + 4, true);
          if (id === "data") {
            dataOff = off + 8;
            dataLen = Math.min(sz, wavBytes.byteLength - dataOff);
            break;
          }
          off += 8 + sz + (sz % 2);
        }
        const totalSamples = Math.floor(dataLen / (2 * channels));
        const step = Math.max(1, Math.floor(sampleRate / fps));
        const env = [];
        for (let i = 0; i < totalSamples; i += step) {
          let sum = 0;
          let cnt = 0;
          const end = Math.min(totalSamples, i + step);
          for (let s = i; s < end; s += 4) {
            const sample = dv.getInt16(dataOff + s * 2 * channels, true) / 32768;
            sum += sample * sample;
            cnt++;
          }
          env.push(cnt ? Math.sqrt(sum / cnt) : 0);
        }
        return { env, stepSec: step / sampleRate };
      } catch (_) {
        return { env: [], stepSec: 1 / fps };
      }
    }

    const VALID_SENTENCE_EXPRS = new Set(["speak", "happy", "shy", "surprised", "troubled", "angry", "sad", "pale", "playful"]);

    async function playWavBytes(audioBytes, sentenceText = "", boostVolume = false, explicitExpr = null, lipsync = null) {
      unlockAudio();
      currentLipsync = (Array.isArray(lipsync) && lipsync.length > 0) ? lipsync : null;
      currentSentenceExpr = (explicitExpr && VALID_SENTENCE_EXPRS.has(explicitExpr))
        ? explicitExpr
        : pickExpressionForText(sentenceText);
      if (currentSentenceExpr === "happy" || currentSentenceExpr === "surprised") {
        triggerPortraitMotion("anim-hop");
      } else if (currentSentenceExpr === "playful") {
        triggerPortraitMotion("anim-playful");
      } else if (currentSentenceExpr === "shy") {
        triggerPortraitMotion("anim-shy");
      } else if (currentSentenceExpr === "sad" || currentSentenceExpr === "pale") {
        triggerPortraitMotion("anim-droop");
      } else if (currentSentenceExpr === "angry") {
        triggerPortraitMotion("anim-shake");
      }

      if (!isIOS) {
        if (!playAnalyser) {
          playAnalyser = audioCtx.createAnalyser();
          playAnalyser.fftSize = 256;
          playGain = audioCtx.createGain();
          playAnalyser.connect(playGain);
          playGain.connect(audioCtx.destination);
        }
        if (playGain) {
          playGain.gain.setValueAtTime(boostVolume ? prefs.alarmVolume : prefs.volume, audioCtx.currentTime);
        }
        if (audioCtx.state === "suspended") {
          await audioCtx.resume().catch(() => {});
        }
        const copy = audioBytes.buffer.slice(audioBytes.byteOffset, audioBytes.byteOffset + audioBytes.byteLength);
        const audioBuffer = await audioCtx.decodeAudioData(copy);
        return new Promise((resolve) => {
          if (callState !== "speaking") { resolve(); return; }
          const src = audioCtx.createBufferSource();
          src.buffer = audioBuffer;
          src.connect(playAnalyser);
          activeSources.push(src);
          currentPlayStartCtxTime = audioCtx.currentTime;
          startLipSync();
          src.onended = () => {
            activeSources = activeSources.filter(s => s !== src);
            if (activeSources.length === 0) {
              if (currentSentenceExpr !== "speak") {
                const holdTarget = exprUrls[`${currentSentenceExpr}_c`] ? `${currentSentenceExpr}_c` : currentSentenceExpr;
                holdExpression(holdTarget, 1500);
              } else {
                setExpression("idle");
              }
            }
            resolve();
          };
          src.start(0);
        });
      }

      const { env, stepSec } = extractWavEnvelope(audioBytes, 30);
      currentRmsEnv = env;
      currentEnvStepSec = stepSec;

      return new Promise((resolve) => {
        if (callState !== "speaking") { resolve(); return; }
        if (currentWavUrl) { URL.revokeObjectURL(currentWavUrl); currentWavUrl = null; }
        const blob = new Blob([audioBytes], { type: "audio/wav" });
        currentWavUrl = URL.createObjectURL(blob);
        playbackResolve = resolve;

        const finish = () => {
          sharedAudioEl.onended = null;
          sharedAudioEl.onerror = null;
          if (currentWavUrl) { URL.revokeObjectURL(currentWavUrl); currentWavUrl = null; }
          if (currentSentenceExpr !== "speak") {
            const holdTarget = exprUrls[`${currentSentenceExpr}_c`] ? `${currentSentenceExpr}_c` : currentSentenceExpr;
            holdExpression(holdTarget, 1500);
          } else {
            setExpression("idle");
          }
          if (playbackResolve === resolve) playbackResolve = null;
          resolve();
        };

        sharedAudioEl.onended = finish;
        sharedAudioEl.onerror = finish;
        sharedAudioEl.src = currentWavUrl;
        sharedAudioEl.play().then(() => {
          startLipSync();
        }).catch(() => {
          finish();
        });
      });
    }

    function escHtml(s) {
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function addHistory(role, text) {
      historyItems.push({ role, text });
      if (historyItems.length > 30) historyItems.shift();
      renderChatFeed(null, true);
    }

    const COPY_ICON = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
    const CHECK_ICON = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;

    const bubbleTtsCache = new Map();
    let playingBubbleIdx = -1;

    async function playBubbleText(text, idx) {
      if (callState === "thinking" || callState === "recording") return;
      if (callState === "speaking" && playingBubbleIdx === idx) {
        stopPlaybackOnly();
        playingBubbleIdx = -1;
        setCallState("idle");
        renderChatFeed(null, false);
        return;
      }
      if (callState === "speaking") stopPlaybackOnly();
      unlockAudio();
      playingBubbleIdx = idx;
      renderChatFeed(null, false);

      let wavBytes = bubbleTtsCache.get(text);
      if (!wavBytes) {
        setCallState("thinking");
        metaText.textContent = "音声生成中...";
        try {
          const res = await fetch("/api/tts", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              text,
              speaker_id: prefs.speakerId,
              speed_scale: prefs.speed,
            }),
          });
          const data = await res.json();
          if (data.audio_base64) {
            wavBytes = Uint8Array.from(atob(data.audio_base64), c => c.charCodeAt(0));
            bubbleTtsCache.set(text, wavBytes);
          }
        } catch (_) {}
      }
      if (!wavBytes) {
        playingBubbleIdx = -1;
        setCallState("idle");
        renderChatFeed(null, false);
        return;
      }
      setCallState("speaking");
      metaText.textContent = "再生中...";
      await playWavBytes(wavBytes, text);
      playingBubbleIdx = -1;
      setCallState("idle");
      metaText.textContent = "準備完了";
      renderChatFeed(null, false);
    }

    function renderChatFeed(streamingText = null, animateLast = false) {
      const items = historyItems.slice();
      if (items.length === 0 && streamingText === null) {
        chatFeed.innerHTML = `<div class="chat-empty">話しかけるか、メッセージを入力してください</div>`;
        return;
      }
      let html = items.map((it, idx) => {
        const enterCls = (animateLast && streamingText === null && idx === items.length - 1) ? " bubble-enter" : "";
        if (it.role === "user") {
          return `<div class="chat-bubble user${enterCls}">${escHtml(it.text)}</div>`;
        }
        const playCls = (playingBubbleIdx === idx) ? " is-playing" : "";
        return `<div class="chat-bubble ai${enterCls}${playCls}" data-idx="${idx}" title="タップで再生">` +
          `<div>${escHtml(it.text)}</div>` +
          `<div class="bubble-actions"><button type="button" class="bubble-copy" data-copy-idx="${idx}" aria-label="コピー">${COPY_ICON}</button></div>` +
          `</div>`;
      }).join("");
      if (streamingText !== null) {
        html += `<div class="chat-bubble ai${animateLast ? " bubble-enter" : ""}">${escHtml(streamingText)}</div>`;
      }
      chatFeed.innerHTML = html;

      chatFeed.querySelectorAll(".bubble-copy").forEach(btn => {
        btn.addEventListener("click", async (e) => {
          e.stopPropagation();
          const idx = Number(btn.dataset.copyIdx);
          const txt = items[idx]?.text || "";
          if (!txt) return;
          try {
            await navigator.clipboard.writeText(txt);
            btn.classList.add("copied");
            btn.innerHTML = CHECK_ICON;
            setTimeout(() => {
              btn.classList.remove("copied");
              btn.innerHTML = COPY_ICON;
            }, 1200);
          } catch (_) {}
        });
      });

      chatFeed.querySelectorAll(".chat-bubble.ai[data-idx]").forEach(el => {
        el.addEventListener("click", () => {
          const idx = Number(el.dataset.idx);
          const txt = items[idx]?.text || "";
          if (txt) playBubbleText(txt, idx);
        });
      });

      requestAnimationFrame(() => { chatScroll.scrollTop = chatScroll.scrollHeight; });
    }
    renderChatFeed();

    function stopLipSync() {
      if (lipSyncRaf) cancelAnimationFrame(lipSyncRaf);
      lipSyncRaf = null;
      if (callState !== "recording" && callState !== "thinking") {
        setExpression("idle");
        waveBars.forEach(b => b.style.height = "5px");
      }
    }

    function startLipSync() {
      if (lipSyncRaf) cancelAnimationFrame(lipSyncRaf);
      const buf = (!isIOS && playAnalyser) ? new Uint8Array(playAnalyser.frequencyBinCount) : null;
      let lastLoudAt = 0;
      function tick() {
        if (callState !== "speaking") {
          stopLipSync();
          return;
        }
        let rms = 0;
        if (buf && playAnalyser) {
          playAnalyser.getByteTimeDomainData(buf);
          let sum = 0;
          for (let i = 0; i < buf.length; i++) {
            const v = (buf[i] - 128) / 128;
            sum += v * v;
          }
          rms = Math.sqrt(sum / buf.length);
        } else {
          const idx = Math.floor((sharedAudioEl.currentTime || 0) / (currentEnvStepSec || 1 / 30));
          rms = currentRmsEnv[idx] || 0;
        }
        const now = performance.now();
        if (currentLipsync) {
          const elapsedMs = (!isIOS && audioCtx)
            ? Math.max(0, (audioCtx.currentTime - currentPlayStartCtxTime) * 1000)
            : Math.max(0, (sharedAudioEl.currentTime || 0) * 1000);
          let shape = "idle";
          for (let i = 0; i < currentLipsync.length; i++) {
            if (currentLipsync[i][0] <= elapsedMs) {
              shape = currentLipsync[i][1];
            } else {
              break;
            }
          }
          if (currentSentenceExpr === "speak") {
            setExpression(shape === "idle" ? "idle" : `speak_${shape}`);
          } else {
            const closedExpr = exprUrls[`${currentSentenceExpr}_c`] ? `${currentSentenceExpr}_c` : currentSentenceExpr;
            setExpression(shape === "idle" ? closedExpr : currentSentenceExpr);
          }
        } else if (rms > 0.028) {
          lastLoudAt = now;
          setExpression(currentSentenceExpr);
        } else if (now - lastLoudAt > 145) {
          if (currentSentenceExpr === "speak") {
            setExpression("idle");
          } else {
            const closedExpr = exprUrls[`${currentSentenceExpr}_c`] ? `${currentSentenceExpr}_c` : currentSentenceExpr;
            setExpression(closedExpr);
          }
        }
        const weights = [0.55, 0.85, 1.0, 0.85, 0.55];
        waveBars.forEach((bar, i) => {
          const h = Math.min(20, Math.max(4, Math.round(4 + rms * 140 * weights[i])));
          bar.style.height = `${h}px`;
        });
        lipSyncRaf = requestAnimationFrame(tick);
      }
      lipSyncRaf = requestAnimationFrame(tick);
    }

    function startMicMeter() {
      if (!micAnalyser) return;
      if (meterRaf) cancelAnimationFrame(meterRaf);
      const buf = new Uint8Array(micAnalyser.frequencyBinCount);
      function tick() {
        if (callState !== "recording") {
          waveBars.forEach(b => b.style.height = "5px");
          return;
        }
        micAnalyser.getByteTimeDomainData(buf);
        let sum = 0;
        for (let i = 0; i < buf.length; i++) {
          const v = (buf[i] - 128) / 128;
          sum += v * v;
        }
        const rms = Math.sqrt(sum / buf.length);
        const weights = [0.55, 0.85, 1.0, 0.85, 0.55];
        waveBars.forEach((bar, idx) => {
          const h = Math.min(20, Math.max(4, Math.round(4 + rms * 180 * weights[idx])));
          bar.style.height = `${h}px`;
        });
        meterRaf = requestAnimationFrame(tick);
      }
      meterRaf = requestAnimationFrame(tick);
    }

    function stopMicMeter() {
      if (meterRaf) cancelAnimationFrame(meterRaf);
      meterRaf = null;
      waveBars.forEach(b => b.style.height = "5px");
    }

    async function consumeChatStream(res) {
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let lineBuf = "";

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        lineBuf += decoder.decode(value, { stream: true });
        const lines = lineBuf.split("\n");
        lineBuf = lines.pop() || "";

        for (const line of lines) {
          if (!line.trim()) continue;
          const ev = JSON.parse(line);
          if (ev.type === "empty") {
            if (prefs.handsfree && callState === "listening") return;
            metaText.textContent = "聞き取れませんでした";
            setCallState("idle");
            return;
          } else if (ev.type === "woke") {
            playChime("start");
            triggerPortraitMotion("anim-nod");
            followUpUntil = Date.now() + 12000;
            setCallState("idle");
            metaText.textContent = "どうぞお話しください";
            return;
          } else if (ev.type === "ignored") {
            if (callState !== "listening") setCallState("idle");
            return;
          } else if (ev.type === "error") {
            if (prefs.handsfree && callState === "listening") return;
            metaText.textContent = "エラー: " + (ev.message || "音声処理に失敗しました");
            setCallState("idle");
            return;
          } else if (ev.type === "stt") {
            setCallState("thinking");
            hasChatted = true;
            addHistory("user", ev.user_text);
            renderChatFeed("……", true);
            metaText.textContent = "考え中...";
          } else if (ev.type === "progress") {
            metaText.textContent = ev.label || "確認中...";
            triggerPortraitMotion("anim-nod");
          } else if (ev.type === "text") {
            replyAcc += (replyAcc ? " " : "") + ev.text;
            renderChatFeed(replyAcc, false);
          } else if (ev.type === "audio") {
            replyAcc += (replyAcc ? " " : "") + ev.text;
            renderChatFeed(replyAcc, false);
            const audioBytes = Uint8Array.from(atob(ev.audio_base64), c => c.charCodeAt(0));
            lastReplyAudios.push(audioBytes);
            setCallState("speaking");
            playChain = playChain.then(() => callState === "speaking" ? playWavBytes(audioBytes, ev.text, false, ev.expr || null, ev.lipsync || null) : undefined);
          } else if (ev.type === "done" && ev.timings) {
            if (replyAcc) addHistory("ai", replyAcc);
            if (prefs.handsfree && hfActive) {
              followUpUntil = Date.now() + 12000;
            }
            metaText.textContent = `応答 ${ev.timings.first_audio}s`;
          }
        }
      }

      await playChain;
      setCallState("idle");
    }

    let wakeCheckBusy = false;

    async function sendAudioStream(blob, ext = "webm", requireWake = false) {
      if (requireWake) {
        if (wakeCheckBusy) return;
        wakeCheckBusy = true;
      } else {
        setCallState("thinking");
        playChime("commit");
        metaText.textContent = "音声処理中...";
      }
      replyAcc = "";
      lastReplyAudios = [];
      playChain = Promise.resolve();
      abortCtrl = new AbortController();

      try {
        const fd = new FormData();
        fd.append("file", blob, `voice.${ext}`);
        fd.append("speaker_id", String(prefs.speakerId));
        fd.append("speed_scale", String(prefs.speed));
        fd.append("require_wake", requireWake ? "true" : "false");
        fd.append("silent", prefs.silent ? "true" : "false");

        const res = await fetch("/api/chat/audio/stream", {
          method: "POST", body: fd, signal: abortCtrl.signal,
        });
        await consumeChatStream(res);
      } catch (err) {
        if (err.name === "AbortError") return;
        if (!requireWake) metaText.textContent = "エラー: " + err.message;
        setCallState("idle");
      } finally {
        if (requireWake) wakeCheckBusy = false;
      }
    }

    function encodePcmWav(chunks, srcRate, targetRate = 16000) {
      let total = 0;
      for (const c of chunks) total += c.length;
      const merged = new Float32Array(total);
      let off = 0;
      for (const c of chunks) { merged.set(c, off); off += c.length; }

      const ratio = srcRate / targetRate;
      const outLen = Math.max(1, Math.floor(merged.length / ratio));
      const buf = new ArrayBuffer(44 + outLen * 2);
      const dv = new DataView(buf);
      const writeStr = (pos, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(pos + i, s.charCodeAt(i)); };
      writeStr(0, "RIFF");
      dv.setUint32(4, 36 + outLen * 2, true);
      writeStr(8, "WAVE");
      writeStr(12, "fmt ");
      dv.setUint32(16, 16, true);
      dv.setUint16(20, 1, true);
      dv.setUint16(22, 1, true);
      dv.setUint32(24, targetRate, true);
      dv.setUint32(28, targetRate * 2, true);
      dv.setUint16(32, 2, true);
      dv.setUint16(34, 16, true);
      writeStr(36, "data");
      dv.setUint32(40, outLen * 2, true);

      for (let i = 0; i < outLen; i++) {
        const idx = i * ratio;
        const lo = Math.floor(idx);
        const hi = Math.min(merged.length - 1, lo + 1);
        const frac = idx - lo;
        const sample = merged[lo] * (1 - frac) + merged[hi] * frac;
        const clamped = Math.max(-1, Math.min(1, sample));
        dv.setInt16(44 + i * 2, clamped < 0 ? clamped * 32768 : clamped * 32767, true);
      }
      return new Blob([buf], { type: "audio/wav" });
    }

    let hfStream = null;
    let hfSource = null;
    let hfProc = null;
    let hfMuteGain = null;

    async function startHandsfree() {
      if (hfActive) return;
      try {
        unlockAudio();
        if (audioCtx.state === "suspended") await audioCtx.resume().catch(() => {});
        hfStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
        });
        const sr = audioCtx.sampleRate || 48000;
        const preRollChunks = [];
        const maxPreRollSamples = Math.floor(sr * 0.7);
        let preRollSamples = 0;

        let noiseFloor = 0.008;
        let consecHot = 0;
        let speechActive = false;
        let speechChunks = [];
        let speechStartMs = 0;
        let lastVoiceMs = 0;

        hfSource = audioCtx.createMediaStreamSource(hfStream);
        hfProc = audioCtx.createScriptProcessor(4096, 1, 1);
        hfMuteGain = audioCtx.createGain();
        hfMuteGain.gain.value = 0;

        hfProc.onaudioprocess = (ev) => {
          if (!hfActive || !prefs.handsfree) return;
          const now = Date.now();
          // 再生中・処理中・アラーム中・再生直後クールダウンは入力を無視してエコー防止
          if (callState !== "listening" || alarmActive || now < hfCooldownUntil) {
            speechActive = false;
            speechChunks = [];
            consecHot = 0;
            preRollChunks.length = 0;
            preRollSamples = 0;
            return;
          }

          const input = ev.inputBuffer.getChannelData(0);
          let sum = 0;
          for (let i = 0; i < input.length; i++) sum += input[i] * input[i];
          const rms = Math.sqrt(sum / input.length);
          const threshold = Math.max(0.014, noiseFloor * 2.8);

          const copy = new Float32Array(input.length);
          copy.set(input);

          if (!speechActive) {
            noiseFloor = Math.min(0.035, Math.max(0.004, noiseFloor * 0.94 + rms * 0.06));
            preRollChunks.push(copy);
            preRollSamples += copy.length;
            while (preRollSamples > maxPreRollSamples && preRollChunks.length > 1) {
              const removed = preRollChunks.shift();
              preRollSamples -= removed.length;
            }
            if (rms >= threshold) {
              consecHot++;
              if (consecHot >= 2) {
                speechActive = true;
                speechStartMs = now;
                lastVoiceMs = now;
                speechChunks = preRollChunks.splice(0, preRollChunks.length);
                preRollSamples = 0;
                if (now <= followUpUntil) metaText.textContent = "聞き取り中...";
              }
            } else {
              consecHot = 0;
            }
          } else {
            speechChunks.push(copy);
            if (rms >= threshold * 0.72) {
              lastVoiceMs = now;
            }
            const silenceMs = now - lastVoiceMs;
            const totalMs = now - speechStartMs;
            if (silenceMs >= 1050 || totalMs >= 12000) {
              const chunksToSend = speechChunks;
              speechActive = false;
              speechChunks = [];
              consecHot = 0;
              if (totalMs < 350) {
                return;
              }
              const wavBlob = encodePcmWav(chunksToSend, sr, 16000);
              const needWake = now > followUpUntil;
              sendAudioStream(wavBlob, "wav", needWake);
            }
          }
        };

        hfSource.connect(hfProc);
        hfProc.connect(hfMuteGain);
        hfMuteGain.connect(audioCtx.destination);

        prefs.handsfree = true;
        hfActive = true;
        applyHandsfreeUi();
        setCallState("listening");
        metaText.textContent = "ハンズフリー待機中";
      } catch (err) {
        stopHandsfree();
        metaText.textContent = "マイク許可が必要です";
      }
    }

    function stopHandsfree() {
      prefs.handsfree = false;
      hfActive = false;
      followUpUntil = 0;
      try { if (hfProc) { hfProc.onaudioprocess = null; hfProc.disconnect(); } } catch (_) {}
      try { if (hfSource) hfSource.disconnect(); } catch (_) {}
      try { if (hfMuteGain) hfMuteGain.disconnect(); } catch (_) {}
      try { if (hfStream) hfStream.getTracks().forEach(t => t.stop()); } catch (_) {}
      hfProc = null;
      hfSource = null;
      hfMuteGain = null;
      hfStream = null;
      applyHandsfreeUi();
      if (callState === "listening") setCallState("idle");
      metaText.textContent = "準備完了";
    }

    async function sendTextStream(text) {
      const trimmed = (text || "").trim();
      if (!trimmed || callState === "thinking" || callState === "recording") return;
      if (callState === "speaking") stopPlaybackOnly();
      unlockAudio();

      setCallState("thinking");
      playChime("commit");
      replyAcc = "";
      lastReplyAudios = [];
      playChain = Promise.resolve();
      abortCtrl = new AbortController();
      metaText.textContent = "考え中...";

      try {
        const res = await fetch("/api/chat/text/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            text: trimmed,
            speaker_id: prefs.speakerId,
            speed_scale: prefs.speed,
            silent: prefs.silent,
          }),
          signal: abortCtrl.signal,
        });
        await consumeChatStream(res);
      } catch (err) {
        if (err.name === "AbortError") return;
        metaText.textContent = "エラー: " + err.message;
        setCallState("idle");
      }
    }

    let recStopTimer = null;
    let isTapping = false;
    let discardRecording = false;

    function releaseMicStream() {
      if (stream) {
        stream.getTracks().forEach(t => { try { t.stop(); } catch (_) {} });
        stream = null;
        micAnalyser = null;
      }
    }

    async function startRecordingManual() {
      if (callState === "recording") return;
      try {
        unlockAudio();
        playChime("start");
        if (isIOS) await new Promise(r => setTimeout(r, 240));
        if (!stream || stream.getAudioTracks().every(t => t.readyState !== "live")) {
          stream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
          });
          micAnalyser = null;
        }
        if (!isIOS && !micAnalyser) {
          const srcNode = audioCtx.createMediaStreamSource(stream);
          micAnalyser = audioCtx.createAnalyser();
          micAnalyser.fftSize = 256;
          srcNode.connect(micAnalyser);
        }
        recChunks = [];
        const candidates = [
          "audio/webm;codecs=opus",
          "audio/webm",
          "audio/mp4",
          "audio/aac",
        ];
        const mimeType = (typeof MediaRecorder.isTypeSupported === "function")
          ? (candidates.find(t => MediaRecorder.isTypeSupported(t)) || "")
          : "";
        const mr = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
        mediaRecorder = mr;
        mr.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) recChunks.push(e.data);
        };
        mr.onerror = () => {
          if (recStopTimer) { clearTimeout(recStopTimer); recStopTimer = null; }
          stopMicMeter();
          releaseMicStream();
          mediaRecorder = null;
          metaText.textContent = "録音エラー";
          setCallState("idle");
        };
        mr.onstop = () => {
          if (recStopTimer) { clearTimeout(recStopTimer); recStopTimer = null; }
          stopMicMeter();
          releaseMicStream();
          if (discardRecording) {
            discardRecording = false;
            recChunks = [];
            metaText.textContent = "キャンセルしました";
            setCallState("idle");
            return;
          }
          const actualType = mr.mimeType || mimeType || "audio/webm";
          const ext = actualType.includes("mp4") ? "m4a"
            : actualType.includes("aac") ? "aac"
            : actualType.includes("ogg") ? "ogg"
            : "webm";
          const blob = new Blob(recChunks, { type: actualType });
          recChunks = [];
          if (blob.size < 800) {
            metaText.textContent = "音声が短すぎます";
            setCallState("idle");
            return;
          }
          sendAudioStream(blob, ext);
        };
        mr.start(isIOS ? 250 : undefined);
        discardRecording = false;
        setCallState("recording");
        triggerPortraitMotion("anim-nod");
        metaText.textContent = "聞いています...";
        if (micAnalyser) startMicMeter();
      } catch (err) {
        releaseMicStream();
        metaText.textContent = "マイクエラー: " + err.message;
        setCallState("idle");
      }
    }

    function stopRecordingManual() {
      if (callState !== "recording" || !mediaRecorder) return;
      stopMicMeter();
      setCallState("thinking");
      metaText.textContent = "音声処理中...";
      const mr = mediaRecorder;
      mediaRecorder = null;
      if (recStopTimer) clearTimeout(recStopTimer);
      recStopTimer = setTimeout(() => {
        recStopTimer = null;
        releaseMicStream();
        if (callState === "thinking") {
          metaText.textContent = "音声を取得できませんでした";
          setCallState("idle");
        }
      }, 2000);
      try {
        if (mr.state !== "inactive") {
          try { mr.requestData(); } catch (_) {}
          mr.stop();
        } else {
          if (recStopTimer) { clearTimeout(recStopTimer); recStopTimer = null; }
          releaseMicStream();
          setCallState("idle");
        }
      } catch (_) {
        if (recStopTimer) { clearTimeout(recStopTimer); recStopTimer = null; }
        releaseMicStream();
        metaText.textContent = "録音停止エラー";
        setCallState("idle");
      }
    }

    async function handleMainTap() {
      if (isTapping) return;
      isTapping = true;
      const unlockTimer = setTimeout(() => { isTapping = false; }, 1200);
      try {
        unlockAudio();
        if (alarmActive) {
          stopAlarm();
          stopPlaybackOnly();
          setCallState("idle");
          metaText.textContent = "アラームを停止しました";
          return;
        }
        if (callState === "speaking") {
          stopPlaybackOnly();
          await startRecordingManual();
          return;
        }
        if (callState === "thinking") return;
        if (callState === "recording") {
          stopRecordingManual();
        } else {
          await startRecordingManual();
        }
      } finally {
        clearTimeout(unlockTimer);
        isTapping = false;
      }
    }

    const textBar = document.getElementById("textBar");
    const textInput = document.getElementById("textInput");
    const textMicBtn = document.getElementById("textMicBtn");
    const syncTextBarState = () => {
      textBar.classList.toggle("has-text", textInput.value.trim().length > 0);
      textInput.style.height = "auto";
      textInput.style.height = Math.min(112, textInput.scrollHeight) + "px";
    };
    textInput.addEventListener("input", syncTextBarState);
    textInput.addEventListener("keydown", (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === "Enter" && !e.isComposing) {
        e.preventDefault();
        textBar.requestSubmit();
      }
    });
    textMicBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      handleMainTap();
    });
    document.getElementById("kbdBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      document.body.classList.toggle("show-text-bar");
      if (document.body.classList.contains("show-text-bar")) textInput.focus();
    });
    textBar.addEventListener("submit", (e) => {
      e.preventDefault();
      unlockAudio();
      const val = textInput.value;
      if (!val.trim()) return;
      textInput.value = "";
      syncTextBarState();
      sendTextStream(val);
    });

    function cancelCurrentAction() {
      if (callState === "recording") {
        discardRecording = true;
        stopMicMeter();
        const mr = mediaRecorder;
        mediaRecorder = null;
        if (recStopTimer) { clearTimeout(recStopTimer); recStopTimer = null; }
        try {
          if (mr && mr.state !== "inactive") {
            mr.stop();
          } else {
            discardRecording = false;
            releaseMicStream();
            metaText.textContent = "キャンセルしました";
            setCallState("idle");
          }
        } catch (_) {
          discardRecording = false;
          releaseMicStream();
          metaText.textContent = "キャンセルしました";
          setCallState("idle");
        }
        return;
      }
      if (callState === "thinking") {
        if (abortCtrl) { abortCtrl.abort(); abortCtrl = null; }
        metaText.textContent = "キャンセルしました";
        setCallState("idle");
        holdExpression("troubled", 1600);
      }
    }

    document.getElementById("textCancelBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      cancelCurrentAction();
    });
    document.getElementById("floatCancelBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      cancelCurrentAction();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && (callState === "recording" || callState === "thinking")) {
        cancelCurrentAction();
      }
    });

    talkBtn.addEventListener("click", handleMainTap);
    rightPane.addEventListener("click", handleMainTap);

    function closeSheets() {
      settingsSheet.classList.remove("open");
      backdrop.classList.remove("open");
    }
    document.getElementById("settingsBtn").addEventListener("click", () => {
      closeSheets();
      settingsSheet.classList.add("open");
      backdrop.classList.add("open");
    });
    document.getElementById("closeSettingsBtn").addEventListener("click", closeSheets);
    backdrop.addEventListener("click", closeSheets);

    modelSelect.addEventListener("change", async () => {
      const mId = modelSelect.value;
      metaText.textContent = "モデル切替中...";
      await fetch("/api/settings", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ agy_model: mId }),
      });
      metaText.textContent = "モデル切替完了";
    });

    speedRange.addEventListener("input", () => {
      prefs.speed = Number(speedRange.value);
      speedVal.textContent = `${prefs.speed.toFixed(2)}x`;
      localStorage.setItem("speed", String(prefs.speed));
      sendWsConfig();
    });
    speedRange.addEventListener("change", () => {
      fetch("/api/settings", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ speed_scale: prefs.speed }),
      }).catch(() => {});
    });

    volRange.addEventListener("input", () => {
      prefs.volume = Number(volRange.value);
      volVal.textContent = `${Math.round(prefs.volume * 100)}%`;
      localStorage.setItem("volume", String(prefs.volume));
      if (playGain && audioCtx && !alarmActive) {
        playGain.gain.setValueAtTime(prefs.volume, audioCtx.currentTime);
      }
    });
    volRange.addEventListener("change", () => {
      unlockAudio();
      playChime("start", false);
    });

    alarmVolRange.addEventListener("input", () => {
      prefs.alarmVolume = Number(alarmVolRange.value);
      alarmVolVal.textContent = `${Math.round(prefs.alarmVolume * 100)}%`;
      localStorage.setItem("alarmVolume", String(prefs.alarmVolume));
      if (playGain && audioCtx && alarmActive) {
        playGain.gain.setValueAtTime(prefs.alarmVolume, audioCtx.currentTime);
      }
    });
    alarmVolRange.addEventListener("change", () => {
      unlockAudio();
      playChime("alarm", true);
    });

    function dismissAlarmFromUi(e) {
      if (e) e.stopPropagation();
      stopAlarm(true);
      stopPlaybackOnly();
      setCallState("idle");
      metaText.textContent = "アラームを停止しました";
    }
    alarmStopBtn.addEventListener("click", dismissAlarmFromUi);
    alarmOverlay.addEventListener("click", (e) => {
      if (e.target === alarmOverlay) dismissAlarmFromUi(e);
    });

    nightToggle.addEventListener("click", () => {
      prefs.night = !prefs.night;
      applyNight();
    });

    resetBtn.addEventListener("click", async () => {
      stopPlaybackOnly();
      await fetch("/api/reset", { method: "POST" });
      historyItems = [];
      hasChatted = false;
      renderChatFeed();
      lastReplyAudios = [];
      applyCharacterVisual();
      closeSheets();
      setCallState("idle");
      metaText.textContent = "リセットしました";
    });

    if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
    async function requestWakeLock() {
      if (!("wakeLock" in navigator)) return;
      try { await navigator.wakeLock.request("screen"); } catch (_) {}
    }
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") requestWakeLock();
    });
    requestWakeLock();
  </script>
</body>
</html>
