<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0D1117" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>VoxMate</title>
  <style>
    :root {
      --accent: #74D969;
      --accent-soft: rgba(116, 217, 105, 0.22);
      --accent-dim: rgba(116, 217, 105, 0.12);
      --bg: #0D1117;
      --panel: rgba(22, 28, 38, 0.72);
      --surface: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.1);
      --text: #F2F6FA;
      --muted: #8E9CAD;
      --rec: #FF5C5C;
      --think: #F5B841;
    }

    body.night {
      --bg: #05070A;
      --panel: rgba(10, 13, 18, 0.85);
      --surface: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.06);
      --text: #AAB6C4;
      --muted: #5C6876;
    }

    body.night .portrait-img {
      filter: brightness(0.7) drop-shadow(0 14px 28px rgba(0, 0, 0, 0.75));
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Sans JP", -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
    }

    /* PC ブラウザでの Echo Show 5 (960x480 / 2:1) 実機比率プレビュー枠 */
    body.preview-frame {
      background: #050709;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    body.preview-frame .device-shell {
      position: relative;
      width: 788px;
      height: 394px;
      max-width: 96vw;
      aspect-ratio: 2 / 1;
      border-radius: 16px;
      overflow: hidden;
      border: 6px solid #202731;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.08);
      transform: translateZ(0);
    }

    body:not(.preview-frame) .device-shell {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .preview-caption {
      display: none;
      font-size: 12px;
      color: #7D8B9B;
      letter-spacing: 0.04em;
    }

    body.preview-frame .preview-caption {
      display: block;
    }

    /* スタジオ背景 */
    .stage-bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 80% 48%, var(--accent-soft) 0%, transparent 52%),
        radial-gradient(circle at 12% 10%, rgba(255, 255, 255, 0.035) 0%, transparent 45%),
        var(--bg);
      transition: background 0.35s ease;
      z-index: 0;
    }

    /* メイン 62:38 左右分割レイアウト */
    .layout {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: 62% 38%;
    }

    /* ========== 左ペイン（62%）：時計 ＋ 広々会話エリア ========== */
    .left-pane {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 14px 10px 14px 20px;
      min-width: 0;
      min-height: 0;
      cursor: default;
    }

    /* 上段：大きな時計 ＋ ユーティリティボタン */
    .left-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      cursor: default;
    }

    .clock-wrap {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .clock-time {
      font-size: 34px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      line-height: 1;
      color: var(--text);
    }

    .clock-date {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
    }

    .header-tools {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tool-btn {
      height: 34px;
      padding: 0 8px;
      border-radius: 50%;
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      touch-action: manipulation;
      transition: color 0.15s, background 0.15s, transform 0.1s;
    }

    .tool-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.08);
    }

    .tool-btn.icon-only {
      width: 34px;
      padding: 0;
      font-size: 16px;
    }

    .tool-btn:active { transform: scale(0.94); }

    /* 中〜下段全体：広々とした会話・字幕エリア */
    .dialogue-area {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 10px;
      padding: 16px 4px 4px;
      overflow: hidden;
    }

    .speaker-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }

    .speaker-id {
      display: inline-flex;
      align-items: baseline;
      gap: 8px;
    }

    .speaker-name {
      font-size: 16px;
      font-weight: 800;
      color: var(--accent);
    }

    .speaker-style {
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
    }

    .meta-badge {
      font-size: 11px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .chat-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 2px 6px 4px 0;
    }

    .chat-scroll::-webkit-scrollbar { width: 3px; }
    .chat-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.18); border-radius: 3px; }

    .chat-feed {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chat-bubble {
      max-width: 88%;
      padding: 9px 13px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 500;
      line-height: 1.5;
      color: var(--text);
      word-break: break-word;
    }

    .chat-bubble.user {
      align-self: flex-end;
      background: #1D2838;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-bottom-right-radius: 5px;
      font-size: 14.5px;
    }

    .chat-bubble.ai {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-bottom-left-radius: 5px;
    }

    /* 右下フローティング・コンパクトマイクピル（画面を圧迫しない） */
    .talk-btn {
      position: absolute;
      right: 14px;
      bottom: 14px;
      z-index: 12;
      height: 40px;
      border-radius: 999px;
      border: 1.5px solid var(--accent);
      background: rgba(13, 17, 23, 0.82);
      backdrop-filter: blur(12px);
      color: var(--text);
      padding: 0 14px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      touch-action: manipulation;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
      transition: background 0.18s, border-color 0.18s, transform 0.1s;
    }

    .talk-btn:active { transform: scale(0.985); }

    body.mode-recording .talk-btn {
      border-color: var(--rec);
      background: rgba(255, 92, 92, 0.22);
    }

    body.mode-thinking .talk-btn {
      border-color: var(--think);
      background: rgba(245, 184, 65, 0.16);
    }

    body.mode-speaking .talk-btn {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .talk-left {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 700;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }
    body.mode-recording .status-dot { background: var(--rec); }
    body.mode-thinking .status-dot { background: var(--think); }

    /* 音量波形 */
    .wave {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 20px;
    }

    .wave-bar {
      width: 3.5px;
      height: 5px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.35);
      transition: height 0.08s linear, background 0.2s;
    }

    body.mode-recording .wave-bar { background: var(--rec); }
    body.mode-speaking .wave-bar { background: var(--accent); }

    body.mode-thinking .wave-bar {
      background: var(--think);
      animation: speakWave 0.72s infinite alternate ease-in-out;
    }
    body.mode-thinking .wave-bar:nth-child(2) { animation-delay: 0.14s; }
    body.mode-thinking .wave-bar:nth-child(3) { animation-delay: 0.28s; }
    body.mode-thinking .wave-bar:nth-child(4) { animation-delay: 0.42s; }
    body.mode-thinking .wave-bar:nth-child(5) { animation-delay: 0.56s; }

    @keyframes speakWave {
      0% { height: 4px; }
      100% { height: 18px; }
    }

    .end-btn {
      height: 100%;
      padding: 0 16px;
      border-radius: 14px;
      border: 1px solid rgba(255, 92, 92, 0.45);
      background: rgba(255, 92, 92, 0.14);
      color: #FF8A8A;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      display: none;
      transition: background 0.15s, transform 0.1s;
    }

    body.in-call .end-btn { display: inline-flex; align-items: center; justify-content: center; }
    .end-btn:active { transform: scale(0.95); }

    body.mode-listening .talk-btn {
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    /* ========== 右ペイン（40%）：フルハイト立ち絵ステージ ========== */
    .right-pane {
      position: relative;
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
    }

    .portrait-img {
      position: relative;
      height: 108%;
      max-width: 96%;
      bottom: -10%;
      object-fit: contain;
      object-position: bottom center;
      filter: drop-shadow(0 12px 26px rgba(0, 0, 0, 0.55));
      transition: opacity 0.2s ease, transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), filter 0.25s ease;
      transform-origin: bottom center;
      pointer-events: none;
      animation: gentleBreath 3.8s infinite ease-in-out;
    }

    @keyframes gentleBreath {
      0%, 100% { transform: scale(1, 1) translateY(0); }
      50% { transform: scale(0.996, 1.007) translateY(-1px); }
    }

    body.mode-thinking .portrait-img {
      animation: none;
      transform: rotate(-1.5deg);
    }

    .portrait-img.anim-hop {
      animation: happyHop 0.56s cubic-bezier(0.22, 1, 0.36, 1) !important;
    }

    @keyframes happyHop {
      0% { transform: translateY(0) scale(1, 1); }
      18% { transform: translateY(2px) scale(1.012, 0.988); }
      50% { transform: translateY(-5px) scale(0.992, 1.014); }
      78% { transform: translateY(1.5px) scale(1.008, 0.993); }
      100% { transform: translateY(0) scale(1, 1); }
    }

    .portrait-img.anim-nod {
      animation: listenNod 0.36s ease-in-out !important;
    }

    @keyframes listenNod {
      0% { transform: translateY(0) scale(1, 1); }
      45% { transform: translateY(3px) scale(1.006, 0.994); }
      100% { transform: translateY(0) scale(1, 1); }
    }

    body.mode-recording .portrait-img {
      filter: drop-shadow(0 0 18px rgba(255, 92, 92, 0.42)) drop-shadow(0 12px 26px rgba(0, 0, 0, 0.55));
    }

    /* オーバーレイシート（設定＆履歴） */
    .backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.62);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 30;
    }
    .backdrop.open { opacity: 1; pointer-events: auto; }

    .sheet {
      position: absolute;
      top: max(10px, env(safe-area-inset-top));
      right: 10px;
      bottom: max(10px, env(safe-area-inset-bottom));
      width: 390px;
      max-width: calc(100% - 20px);
      background: #141B24;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      transform: translateX(110%);
      transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 40;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
    }
    .sheet.open { transform: translateX(0); }

    .sheet-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 16px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .char-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .char-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1.5px solid transparent;
      border-radius: 12px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      text-align: left;
      color: var(--text);
    }

    .char-card.selected {
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.1);
    }

    .char-card img {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      background: #1B232E;
      flex-shrink: 0;
    }

    .char-card-name { font-size: 13px; font-weight: 700; line-height: 1.2; }
    .char-card-style { font-size: 10px; color: var(--muted); }

    .setting-block { display: flex; flex-direction: column; gap: 6px; }
    .setting-label { font-size: 12px; color: var(--muted); font-weight: 600; display: flex; justify-content: space-between; }

    select.setting-select {
      width: 100%;
      background: #1D2734;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 10px;
      font-size: 13px;
      font-family: inherit;
    }

    input[type="range"] { width: 100%; accent-color: var(--accent); height: 22px; }

    .row-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1D2734;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .hist-item {
      padding: 9px 12px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.45;
    }
    .hist-item.user { background: #1D2734; align-self: flex-end; max-width: 90%; }
    .hist-item.ai { background: rgba(255, 255, 255, 0.06); border-left: 3px solid var(--accent); align-self: flex-start; max-width: 95%; }

    /* スリムな統合コンポーザーバー（案1） */
    .text-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      padding: 4px 4px 4px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(15, 20, 28, 0.84);
      flex-shrink: 0;
      cursor: default;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .text-bar:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-dim);
    }

    .text-input {
      flex: 1;
      min-width: 0;
      height: 36px;
      padding: 0;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    .text-input::placeholder { color: var(--muted); }

    .text-send {
      height: 36px;
      padding: 0 14px;
      border-radius: 999px;
      border: none;
      background: var(--accent);
      color: #0B1220;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
      display: none;
      align-items: center;
      gap: 4px;
      touch-action: manipulation;
    }
    .text-send:active { transform: scale(0.96); }
    .text-bar.has-text .text-send { display: inline-flex; }
    .text-bar.has-text .text-mic-btn { display: none; }

    .text-mic-btn {
      height: 36px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--accent);
      background: var(--accent-dim);
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      flex-shrink: 0;
      touch-action: manipulation;
      transition: background 0.18s, border-color 0.18s, transform 0.1s;
    }
    .text-mic-btn:active { transform: scale(0.97); }
    .text-mic-btn .talk-left { font-size: 13px; gap: 7px; }
    .text-mic-btn .wave { gap: 2px; }

    body.mode-recording .text-mic-btn {
      border-color: var(--rec);
      background: rgba(255, 92, 92, 0.22);
    }
    body.mode-thinking .text-mic-btn {
      border-color: var(--think);
      background: rgba(245, 184, 65, 0.16);
    }
    body.mode-speaking .text-mic-btn {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    /* スマホ・PCでは統合バー内に「話す」を収めるため右下フローティングボタンを隠す */
    .talk-btn { display: none; }
    .kbd-toggle { display: none; }

    /* Echo Show 5 等の小型横長画面では従来通り右下「話す」ピル＋⌨開閉 */
    @media (max-width: 820px) and (max-height: 430px) {
      .talk-btn { display: inline-flex; }
      .kbd-toggle { display: inline-flex; }
      .text-bar { display: none; }
      body.show-text-bar .text-bar { display: flex; }
      .text-mic-btn { display: none; }
      .text-send { display: inline-flex; }
    }

    /* スマホ縦画面向けレスポンシブ（iPhone ノッチ / ホームバー対応） */
    @media (max-width: 720px) and (orientation: portrait) {
      .layout {
        grid-template-columns: 1fr;
        grid-template-rows: 38% 62%;
      }
      .right-pane {
        order: -1;
        padding: max(22px, calc(env(safe-area-inset-top) + 12px)) 16px 6px;
        align-items: center;
      }
      .portrait-img {
        height: 100%;
        max-height: 100%;
        bottom: 0;
        object-position: center bottom;
      }
      .left-pane {
        padding: 8px 16px max(16px, calc(env(safe-area-inset-bottom) + 10px));
      }
      .left-header {
        padding-bottom: 8px;
      }
      .clock-time {
        font-size: 26px;
      }
      .reply-text {
        font-size: 17px;
      }
      .text-bar {
        margin-top: 10px;
      }
      .text-input {
        font-size: 16px;
      }
      .sheet {
        width: min(360px, calc(100vw - 20px));
      }
    }

    /* PC・大画面向けカード表示（?preview=1 以外） */
    @media (min-width: 1000px) and (min-height: 540px) {
      body:not(.preview-frame) {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #070A0F;
      }
      body:not(.preview-frame) .device-shell {
        width: min(1040px, 94vw);
        height: min(560px, 88vh);
        border-radius: 18px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.65);
        overflow: hidden;
      }
    }
  </style>
</head>
<body>
  <div class="device-shell">
    <div class="stage-bg"></div>

    <div class="layout">
      <!-- 左 62%：時計 ＋ 広々会話エリア -->
      <div id="leftPane" class="left-pane">
        <header id="leftHeader" class="left-header">
          <div class="clock-wrap">
            <span id="clockTime" class="clock-time">--:--</span>
            <span id="clockDate" class="clock-date"></span>
          </div>
          <div class="header-tools">
            <button id="replayBtn" class="tool-btn icon-only" style="display:none;" aria-label="もう一回再生" title="もう一回再生">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
                <path d="M3 3v5h5" />
              </svg>
            </button>
            <button id="kbdBtn" class="tool-btn icon-only kbd-toggle" aria-label="文字入力" title="文字入力">⌨</button>
            <button id="settingsBtn" class="tool-btn icon-only" aria-label="メニュー" title="メニュー">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <line x1="4" y1="7" x2="20" y2="7" />
                <line x1="4" y1="12" x2="20" y2="12" />
                <line x1="4" y1="17" x2="20" y2="17" />
              </svg>
            </button>
          </div>
        </header>

        <section class="dialogue-area">
          <div class="speaker-row">
            <div class="speaker-id">
              <span id="speakerName" class="speaker-name">ずんだもん</span>
              <span id="speakerStyle" class="speaker-style">ノーマル</span>
            </div>
            <span id="metaText" class="meta-badge">準備完了</span>

    // 優しい効果音（Web Audio API 合成）
    function playChime(kind) {
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const notes = kind === "start" ? [523.25, 659.25] :
                      kind === "commit" ? [783.99] :
                      kind === "end" ? [659.25, 440.0] : [];
        notes.forEach((freq, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, now + i * 0.08);
          gain.gain.setValueAtTime(0.001, now + i * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.08, now + i * 0.08 + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.14);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + i * 0.08);
          osc.stop(now + i * 0.08 + 0.16);
        });
      } catch (_) {}
    }

    function setExpression(expr) {
      if (!exprUrls[expr] || currentExpr === expr) return;
      currentExpr = expr;
      portraitImg.src = exprUrls[expr];
    }

    function scheduleBlink() {
      if (blinkTimer) clearTimeout(blinkTimer);
      const wait = 3000 + Math.random() * 3200;
      blinkTimer = setTimeout(() => {
        if ((callState === "idle" || callState === "listening") && currentExpr === "idle") {
          setExpression("blink");
          setTimeout(() => {
            if ((callState === "idle" || callState === "listening") && currentExpr === "blink") {
              setExpression("idle");
              if (Math.random() < 0.15) {
                setTimeout(() => {
                  if ((callState === "idle" || callState === "listening") && currentExpr === "idle") {
                    setExpression("blink");
                    setTimeout(() => {
                      if (currentExpr === "blink") setExpression("idle");
                    }, 95);
                  }
                }, 130);
              }
            }
          }, 95);
        }
        scheduleBlink();
      }, wait);
    }
    scheduleBlink();

    function triggerPortraitMotion(cls) {
      portraitImg.classList.remove("anim-hop", "anim-nod");
      void portraitImg.offsetWidth;
      portraitImg.classList.add(cls);

    function updateClock() {
      const now = new Date();

    }
    updateClock();
    setInterval(updateClock, 10000);

    function hexToRgba(hex, alpha) {
      const m = hex.replace("#", "").match(/.{2}/g);
      if (!m) return `rgba(116, 217, 105, ${alpha})`;
      const [r, g, b] = m.map(x => parseInt(x, 16));
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function applyCharacterVisual() {
      const sp = speakersList.find(s => s.id === prefs.speakerId) || {
        id: 3, name: "ずんだもん", style: "ノーマル", color: "#74D969"
      };

      document.documentElement.style.setProperty("--accent", color);
      document.documentElement.style.setProperty("--accent-soft", hexToRgba(color, 0.24));
      document.documentElement.style.setProperty("--accent-dim", hexToRgba(color, 0.13));
      speakerNameEl.textContent = sp.name;
      speakerStyleEl.textContent = sp.style;
      if (!hasChatted) {
        renderChatFeed();
      }
      exprUrls = {
        idle: `/api/character/${sp.id}/portrait?expr=idle&v=ahiru4`,
        blink: `/api/character/${sp.id}/portrait?expr=blink&v=ahiru4`,
        speak: `/api/character/${sp.id}/portrait?expr=speak&v=ahiru4`,
        think: `/api/character/${sp.id}/portrait?expr=think&v=ahiru4`,
        happy: `/api/character/${sp.id}/portrait?expr=happy&v=ahiru4`,
      };
      Object.values(exprUrls).forEach(url => { const im = new Image(); im.src = url; });
      currentExpr = "idle";
      portraitImg.style.opacity = "0";
      setTimeout(() => {
        portraitImg.src = exprUrls.idle;
        portraitImg.onload = () => { portraitImg.style.opacity = "1"; };
      }, 90);
      renderCharGrid();
      sendWsConfig();
    }

    function renderCharGrid() {
      charGrid.innerHTML = speakersList.map(sp => `
        <button class="char-card ${sp.id === prefs.speakerId ? "selected" : ""}" data-id="${sp.id}">
          <img src="/api/character/${sp.id}/icon?v=ahiru6" alt="${sp.name}" />
          <div>
            <div class="char-card-name">${sp.name}</div>
            <div class="char-card-style">${sp.style}</div>
          </div>
        </button>
      `).join("");
      charGrid.querySelectorAll(".char-card").forEach(btn => {
        btn.addEventListener("click", () => {
          prefs.speakerId = Number(btn.dataset.id);
          localStorage.setItem("speakerId", String(prefs.speakerId));
          applyCharacterVisual();
          fetch("/api/settings", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ speaker_id: prefs.speakerId }),
          }).catch(() => {});
        });
      });
    }

    function applyNight() {
      document.body.classList.toggle("night", prefs.night);
      nightState.textContent = prefs.night ? "ON" : "OFF";
      localStorage.setItem("night", prefs.night ? "1" : "0");
    }
    applyNight();

    speedRange.value = String(prefs.speed);
    speedVal.textContent = `${prefs.speed.toFixed(2)}x`;

    function setCallState(next) {
      callState = next;
      document.body.classList.remove("mode-listening", "mode-recording", "mode-thinking", "mode-speaking");
      if (next !== "idle") document.body.classList.add(`mode-${next}`);

      const labelText = next === "idle" ? "話す"
        : next === "recording" ? "送信する"
        : next === "thinking" ? "考え中..."
        : next === "speaking" ? "割り込む" : "話す";
      talkLabels.forEach(el => { el.textContent = labelText; });

      if (next === "idle") {
        setExpression("idle");
        waveBars.forEach(b => b.style.height = "5px");
      } else if (next === "recording") {
        setExpression("idle");
      } else if (next === "thinking") {

      }
    }

    let syncedVersion = 0;
    function applySyncedState(data, firstLoad = false) {
      if (data.agy_model && modelSelect.options.length > 0) {
        modelSelect.value = data.agy_model;
      }
      const ver = Number(data.state_version || 0);
      if (!firstLoad && ver === syncedVersion) return;
      syncedVersion = ver;
      let needVisual = firstLoad;
      if (typeof data.speaker_id === "number" && data.speaker_id !== prefs.speakerId) {
        prefs.speakerId = data.speaker_id;
        localStorage.setItem("speakerId", String(prefs.speakerId));
        needVisual = true;
      }
      if (typeof data.speed_scale === "number" && Math.abs(data.speed_scale - prefs.speed) > 1e-3) {
        prefs.speed = data.speed_scale;
        localStorage.setItem("speed", String(prefs.speed));
        speedRange.value = String(prefs.speed);
        speedVal.textContent = `${prefs.speed.toFixed(2)}x`;
      }
      if (Array.isArray(data.history) && callState === "idle") {
        const prevLen = historyItems.length;
        const prevLast = historyItems[historyItems.length - 1]?.text;
        historyItems = data.history.slice();
        hasChatted = historyItems.length > 0;
        const hasAi = historyItems.some(h => h.role === "ai");
        replayBtn.style.display = hasAi ? "inline-flex" : "none";
        if (historyItems.length !== prevLen || historyItems[historyItems.length - 1]?.text !== prevLast) {
          lastReplyAudios = [];
        }
        renderChatFeed();
      }
      if (needVisual) applyCharacterVisual();
    }

    async function loadHealth() {
      try {
        const res = await fetch("/api/health");
        const data = await res.json();
        const firstLoad = speakersList.length === 0;
        if (data.speakers && firstLoad) {
          speakersList = data.speakers;
        }
        if (data.models && modelsList.length === 0) {
          modelsList = data.models;
          modelSelect.innerHTML = modelsList.map(m => `<option value="${m.id}">${m.label}</option>`).join("");
        }
        applySyncedState(data, firstLoad);
      } catch (_) {}
    }

    async function syncState() {
      if (speakersList.length === 0) return;
      try {
        const res = await fetch("/api/state");
        const data = await res.json();
        applySyncedState(data, false);
      } catch (_) {}
    }
    loadHealth();
    setInterval(loadHealth, 15000);
    setInterval(syncState, 3000);

    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    let audioUnlocked = false;
    const sharedAudioEl = new Audio();
    sharedAudioEl.playsInline = true;
    let sharedElUnlocked = false;
    let currentWavUrl = null;
    let currentRmsEnv = [];
    let currentEnvStepSec = 1 / 30;
    let playbackResolve = null;

    function unlockAudio() {
      try {
        if (!audioCtx) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          audioCtx = new Ctx();
        }
        if (audioCtx.state === "suspended") {
          audioCtx.resume().catch(() => {});
        }
        if (!audioUnlocked && audioCtx.state === "running") {
          const b = audioCtx.createBuffer(1, 1, 22050);
          const s = audioCtx.createBufferSource();
          s.buffer = b;
          s.connect(audioCtx.destination);
          s.start(0);
          audioUnlocked = true;
        }
      } catch (_) {}
      if (isIOS && !sharedElUnlocked) {
        sharedElUnlocked = true;
        try {
          sharedAudioEl.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";
          const p = sharedAudioEl.play();
          if (p && p.catch) p.catch(() => { sharedElUnlocked = false; });
        } catch (_) {
          sharedElUnlocked = false;
        }
      }
    }

    function sendWsConfig() {}

    function stopPlaybackOnly() {
      if (abortCtrl) { abortCtrl.abort(); abortCtrl = null; }
      try { sharedAudioEl.pause(); sharedAudioEl.currentTime = 0; } catch (_) {}
      if (currentWavUrl) { URL.revokeObjectURL(currentWavUrl); currentWavUrl = null; }
      if (playbackResolve) { const r = playbackResolve; playbackResolve = null; r(); }
      activeSources.forEach(s => { try { s.stop(); } catch (_) {} });
      activeSources = [];
      playChain = Promise.resolve();
      stopLipSync();
    }

    function extractWavEnvelope(wavBytes, fps = 30) {
      try {
        const dv = new DataView(wavBytes.buffer, wavBytes.byteOffset, wavBytes.byteLength);
        const sampleRate = dv.getUint32(24, true) || 24000;
        const channels = dv.getUint16(22, true) || 1;
        // "data" チャンクを探す
        let off = 12;
        let dataOff = 44;
        let dataLen = wavBytes.byteLength - 44;
        while (off + 8 <= wavBytes.byteLength) {
          const id = String.fromCharCode(wavBytes[off], wavBytes[off + 1], wavBytes[off + 2], wavBytes[off + 3]);
          const sz = dv.getUint32(off + 4, true);
          if (id === "data") {
            dataOff = off + 8;
            dataLen = Math.min(sz, wavBytes.byteLength - dataOff);
            break;
          }
          off += 8 + sz + (sz % 2);
        }
        const totalSamples = Math.floor(dataLen / (2 * channels));
        const step = Math.max(1, Math.floor(sampleRate / fps));
        const env = [];
        for (let i = 0; i < totalSamples; i += step) {
          let sum = 0;
          let cnt = 0;
          const end = Math.min(totalSamples, i + step);
          for (let s = i; s < end; s += 4) {
            const sample = dv.getInt16(dataOff + s * 2 * channels, true) / 32768;
            sum += sample * sample;
            cnt++;
          }
          env.push(cnt ? Math.sqrt(sum / cnt) : 0);
        }
        return { env, stepSec: step / sampleRate };
      } catch (_) {
        return { env: [], stepSec: 1 / fps };
      }
    }

    async function playWavBytes(audioBytes, sentenceText = "") {
      unlockAudio();
      currentSentenceHappy = /[！!♪♫嬉楽最高ありがと]/.test(sentenceText);
      if (currentSentenceHappy) triggerPortraitMotion("anim-hop");

      if (!isIOS) {
        if (!playAnalyser) {
          playAnalyser = audioCtx.createAnalyser();
          playAnalyser.fftSize = 256;
          playAnalyser.connect(audioCtx.destination);
        }
        if (audioCtx.state === "suspended") {
          await audioCtx.resume().catch(() => {});
        }
        const copy = audioBytes.buffer.slice(audioBytes.byteOffset, audioBytes.byteOffset + audioBytes.byteLength);
        const audioBuffer = await audioCtx.decodeAudioData(copy);
        return new Promise((resolve) => {
          if (callState !== "speaking") { resolve(); return; }
          const src = audioCtx.createBufferSource();
          src.buffer = audioBuffer;
          src.connect(playAnalyser);
          activeSources.push(src);
          startLipSync();
          src.onended = () => {
            activeSources = activeSources.filter(s => s !== src);
            if (activeSources.length === 0) setExpression("idle");
            resolve();
          };
          src.start(0);
        });
      }

      const { env, stepSec } = extractWavEnvelope(audioBytes, 30);
      currentRmsEnv = env;
      currentEnvStepSec = stepSec;

      return new Promise((resolve) => {
        if (callState !== "speaking") { resolve(); return; }
        if (currentWavUrl) { URL.revokeObjectURL(currentWavUrl); currentWavUrl = null; }
        const blob = new Blob([audioBytes], { type: "audio/wav" });
        currentWavUrl = URL.createObjectURL(blob);
        playbackResolve = resolve;

        const finish = () => {
          sharedAudioEl.onended = null;
          sharedAudioEl.onerror = null;
          if (currentWavUrl) { URL.revokeObjectURL(currentWavUrl); currentWavUrl = null; }
          setExpression("idle");
          if (playbackResolve === resolve) playbackResolve = null;
          resolve();
        };

        sharedAudioEl.onended = finish;
        sharedAudioEl.onerror = finish;
        sharedAudioEl.src = currentWavUrl;
        sharedAudioEl.play().then(() => {
          startLipSync();
        }).catch(() => {
          finish();
        });
      });
    }

    function escHtml(s) {
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function addHistory(role, text) {
      historyItems.push({ role, text });
      if (historyItems.length > 30) historyItems.shift();
      renderChatFeed();
    }

    function renderChatFeed(streamingText = null) {
      const items = historyItems.slice();
      if (items.length === 0 && streamingText === null) {
        const sp = speakersList.find(s => s.id === prefs.speakerId);
        const greet = (sp && GREETINGS[sp.name]) || "いつでも話しかけてね！";
        chatFeed.innerHTML = `<div class="chat-bubble ai">${escHtml(greet)}</div>`;
        return;
      }
      let html = items.map(it =>
        `<div class="chat-bubble ${it.role}">${escHtml(it.text)}</div>`
      ).join("");
      if (streamingText !== null) {
        html += `<div class="chat-bubble ai">${escHtml(streamingText)}</div>`;
      }
      chatFeed.innerHTML = html;
      requestAnimationFrame(() => { chatScroll.scrollTop = chatScroll.scrollHeight; });
    }
    renderChatFeed();

    function stopLipSync() {
      if (lipSyncRaf) cancelAnimationFrame(lipSyncRaf);
      lipSyncRaf = null;
      if (callState !== "recording" && callState !== "thinking") {
        setExpression("idle");
        waveBars.forEach(b => b.style.height = "5px");
      }
    }

    function startLipSync() {
      if (lipSyncRaf) cancelAnimationFrame(lipSyncRaf);
      const buf = (!isIOS && playAnalyser) ? new Uint8Array(playAnalyser.frequencyBinCount) : null;
      let lastLoudAt = 0;
      function tick() {
        if (callState !== "speaking") {
          stopLipSync();
          return;
        }
        let rms = 0;
        if (buf && playAnalyser) {
          playAnalyser.getByteTimeDomainData(buf);
          let sum = 0;
          for (let i = 0; i < buf.length; i++) {
            const v = (buf[i] - 128) / 128;
            sum += v * v;
          }
          rms = Math.sqrt(sum / buf.length);
        } else {
          const idx = Math.floor((sharedAudioEl.currentTime || 0) / (currentEnvStepSec || 1 / 30));
          rms = currentRmsEnv[idx] || 0;
        }
        const now = performance.now();
        if (rms > 0.028) {
          lastLoudAt = now;
          setExpression(currentSentenceHappy ? "happy" : "speak");
        } else if (now - lastLoudAt > 145) {
          setExpression("idle");
        }
        const weights = [0.55, 0.85, 1.0, 0.85, 0.55];
        waveBars.forEach((bar, i) => {
          const h = Math.min(20, Math.max(4, Math.round(4 + rms * 140 * weights[i])));
          bar.style.height = `${h}px`;
        });
        lipSyncRaf = requestAnimationFrame(tick);
      }
      lipSyncRaf = requestAnimationFrame(tick);
    }

    function startMicMeter() {
      if (!micAnalyser) return;
      if (meterRaf) cancelAnimationFrame(meterRaf);
      const buf = new Uint8Array(micAnalyser.frequencyBinCount);
      function tick() {
        if (callState !== "recording") {
          waveBars.forEach(b => b.style.height = "5px");
          return;
        }
        micAnalyser.getByteTimeDomainData(buf);
        let sum = 0;
        for (let i = 0; i < buf.length; i++) {
          const v = (buf[i] - 128) / 128;
          sum += v * v;
        }
        const rms = Math.sqrt(sum / buf.length);
        const weights = [0.55, 0.85, 1.0, 0.85, 0.55];
        waveBars.forEach((bar, idx) => {
          const h = Math.min(20, Math.max(4, Math.round(4 + rms * 180 * weights[idx])));
          bar.style.height = `${h}px`;
        });
        meterRaf = requestAnimationFrame(tick);
      }
      meterRaf = requestAnimationFrame(tick);
    }

    function stopMicMeter() {
      if (meterRaf) cancelAnimationFrame(meterRaf);
      meterRaf = null;
      waveBars.forEach(b => b.style.height = "5px");
    }

    async function consumeChatStream(res) {
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let lineBuf = "";

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        lineBuf += decoder.decode(value, { stream: true });
        const lines = lineBuf.split("\n");
        lineBuf = lines.pop() || "";

        for (const line of lines) {
          if (!line.trim()) continue;
          const ev = JSON.parse(line);
          if (ev.type === "empty") {
            metaText.textContent = "聞き取れませんでした";
            setCallState("idle");
            return;
          } else if (ev.type === "error") {
            metaText.textContent = "エラー: " + (ev.message || "音声処理に失敗しました");
            setCallState("idle");
            return;
          } else if (ev.type === "stt") {
            hasChatted = true;
            addHistory("user", ev.user_text);
            renderChatFeed("……");
            metaText.textContent = "考え中...";
          } else if (ev.type === "audio") {
            replyAcc += (replyAcc ? " " : "") + ev.text;
            renderChatFeed(replyAcc);
            const audioBytes = Uint8Array.from(atob(ev.audio_base64), c => c.charCodeAt(0));
            lastReplyAudios.push(audioBytes);
            replayBtn.style.display = "inline-flex";
            setCallState("speaking");
            playChain = playChain.then(() => callState === "speaking" ? playWavBytes(audioBytes, ev.text) : undefined);
          } else if (ev.type === "done" && ev.timings) {
            if (replyAcc) addHistory("ai", replyAcc);
            metaText.textContent = `応答 ${ev.timings.first_audio}s`;
          }
        }
      }

      await playChain;
      setCallState("idle");
    }

    async function sendAudioStream(blob, ext = "webm") {
      setCallState("thinking");
      playChime("commit");
      replyAcc = "";
      lastReplyAudios = [];
      playChain = Promise.resolve();
      abortCtrl = new AbortController();
      metaText.textContent = "音声処理中...";

      try {
        const fd = new FormData();
        fd.append("file", blob, `voice.${ext}`);
        fd.append("speaker_id", String(prefs.speakerId));
        fd.append("speed_scale", String(prefs.speed));

        const res = await fetch("/api/chat/audio/stream", {
          method: "POST", body: fd, signal: abortCtrl.signal,
        });
        await consumeChatStream(res);
      } catch (err) {
        if (err.name === "AbortError") return;
        metaText.textContent = "エラー: " + err.message;
        setCallState("idle");
      }
    }

    async function sendTextStream(text) {
      const trimmed = (text || "").trim();
      if (!trimmed || callState === "thinking" || callState === "recording") return;
      if (callState === "speaking") stopPlaybackOnly();
      unlockAudio();

      setCallState("thinking");
      playChime("commit");
      replyAcc = "";
      lastReplyAudios = [];
      playChain = Promise.resolve();
      abortCtrl = new AbortController();
      metaText.textContent = "考え中...";

      try {
        const res = await fetch("/api/chat/text/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            text: trimmed,
            speaker_id: prefs.speakerId,
            speed_scale: prefs.speed,
          }),
          signal: abortCtrl.signal,
        });
        await consumeChatStream(res);
      } catch (err) {
        if (err.name === "AbortError") return;
        metaText.textContent = "エラー: " + err.message;
        setCallState("idle");
      }
    }

    let recStopTimer = null;
    let isTapping = false;

    function releaseMicStream() {
      if (stream) {
        stream.getTracks().forEach(t => { try { t.stop(); } catch (_) {} });
        stream = null;
        micAnalyser = null;
      }
    }

    async function startRecordingManual() {
      if (callState === "recording") return;
      try {
        unlockAudio();
        playChime("start");
        if (isIOS) await new Promise(r => setTimeout(r, 240));
        if (!stream || stream.getAudioTracks().every(t => t.readyState !== "live")) {
          stream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
          });
          micAnalyser = null;
        }
        if (!isIOS && !micAnalyser) {
          const srcNode = audioCtx.createMediaStreamSource(stream);
          micAnalyser = audioCtx.createAnalyser();
          micAnalyser.fftSize = 256;
          srcNode.connect(micAnalyser);
        }
        recChunks = [];
        const candidates = [
          "audio/webm;codecs=opus",
          "audio/webm",
          "audio/mp4",
          "audio/aac",
        ];
        const mimeType = (typeof MediaRecorder.isTypeSupported === "function")
          ? (candidates.find(t => MediaRecorder.isTypeSupported(t)) || "")
          : "";
        const mr = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
        mediaRecorder = mr;
        mr.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) recChunks.push(e.data);
        };
        mr.onerror = () => {
          if (recStopTimer) { clearTimeout(recStopTimer); recStopTimer = null; }
          stopMicMeter();
          releaseMicStream();
          mediaRecorder = null;
          metaText.textContent = "録音エラー";
          setCallState("idle");
        };
        mr.onstop = () => {
          if (recStopTimer) { clearTimeout(recStopTimer); recStopTimer = null; }
          stopMicMeter();
          releaseMicStream();
          const actualType = mr.mimeType || mimeType || "audio/webm";
          const ext = actualType.includes("mp4") ? "m4a"
            : actualType.includes("aac") ? "aac"
            : actualType.includes("ogg") ? "ogg"
            : "webm";
          const blob = new Blob(recChunks, { type: actualType });
          recChunks = [];
          if (blob.size < 800) {
            metaText.textContent = "音声が短すぎます";
            setCallState("idle");
            return;
          }
          sendAudioStream(blob, ext);
        };
        mr.start(isIOS ? 250 : undefined);
        setCallState("recording");
        triggerPortraitMotion("anim-nod");
        metaText.textContent = "聞いています...";
        if (micAnalyser) startMicMeter();
      } catch (err) {
        releaseMicStream();
        metaText.textContent = "マイクエラー: " + err.message;
        setCallState("idle");
      }
    }

    function stopRecordingManual() {
      if (callState !== "recording" || !mediaRecorder) return;
      stopMicMeter();
      setCallState("thinking");
      metaText.textContent = "音声処理中...";
      const mr = mediaRecorder;
      mediaRecorder = null;
      if (recStopTimer) clearTimeout(recStopTimer);
      recStopTimer = setTimeout(() => {
        recStopTimer = null;
        releaseMicStream();
        if (callState === "thinking") {
          metaText.textContent = "音声を取得できませんでした";
          setCallState("idle");
        }
      }, 2000);
      try {
        if (mr.state !== "inactive") {
          try { mr.requestData(); } catch (_) {}
          mr.stop();
        } else {
          if (recStopTimer) { clearTimeout(recStopTimer); recStopTimer = null; }
          releaseMicStream();
          setCallState("idle");
        }
      } catch (_) {
        if (recStopTimer) { clearTimeout(recStopTimer); recStopTimer = null; }
        releaseMicStream();
        metaText.textContent = "録音停止エラー";
        setCallState("idle");
      }
    }

    async function handleMainTap() {
      if (isTapping) return;
      isTapping = true;
      const unlockTimer = setTimeout(() => { isTapping = false; }, 1200);
      try {
        unlockAudio();
        if (callState === "speaking") {
          stopPlaybackOnly();
          await startRecordingManual();
          return;
        }
        if (callState === "thinking") return;
        if (callState === "recording") {
          stopRecordingManual();
        } else {
          await startRecordingManual();
        }
      } finally {
        clearTimeout(unlockTimer);
        isTapping = false;
      }
    }

    const textBar = document.getElementById("textBar");
    const textInput = document.getElementById("textInput");
    const textMicBtn = document.getElementById("textMicBtn");
    const syncTextBarState = () => {
      textBar.classList.toggle("has-text", textInput.value.trim().length > 0);
    };
    textInput.addEventListener("input", syncTextBarState);
    textMicBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      handleMainTap();
    });
    document.getElementById("kbdBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      document.body.classList.toggle("show-text-bar");
      if (document.body.classList.contains("show-text-bar")) textInput.focus();
    });
    textBar.addEventListener("submit", (e) => {
      e.preventDefault();
      unlockAudio();
      const val = textInput.value;
      if (!val.trim()) return;
      textInput.value = "";
      syncTextBarState();
      sendTextStream(val);
    });

    talkBtn.addEventListener("click", handleMainTap);
    rightPane.addEventListener("click", handleMainTap);

    replayBtn.addEventListener("click", async () => {
      if (callState === "thinking" || callState === "speaking" || callState === "recording") return;
      unlockAudio();
      const lastAi = [...historyItems].reverse().find(h => h.role === "ai");
      if (lastReplyAudios.length === 0 && lastAi) {
        setCallState("thinking");
        metaText.textContent = "音声生成中...";
        try {
          const res = await fetch("/api/tts", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              text: lastAi.text,
              speaker_id: prefs.speakerId,
              speed_scale: prefs.speed,
            }),
          });
          const data = await res.json();
          if (data.audio_base64) {
            lastReplyAudios = [Uint8Array.from(atob(data.audio_base64), c => c.charCodeAt(0))];
          }
        } catch (_) {}
      }
      if (lastReplyAudios.length === 0) {
        setCallState("idle");
        return;
      }
      setCallState("speaking");
      metaText.textContent = "再生中...";
      for (const bytes of lastReplyAudios) {
        if (callState !== "speaking") break;
        await playWavBytes(bytes, "");
      }
      setCallState("idle");
      metaText.textContent = "準備完了";
    });

    function closeSheets() {
      settingsSheet.classList.remove("open");
      backdrop.classList.remove("open");
    }
    document.getElementById("settingsBtn").addEventListener("click", () => {
      closeSheets();
      settingsSheet.classList.add("open");
      backdrop.classList.add("open");
    });
    document.getElementById("closeSettingsBtn").addEventListener("click", closeSheets);
    backdrop.addEventListener("click", closeSheets);

    modelSelect.addEventListener("change", async () => {
      const mId = modelSelect.value;
      metaText.textContent = "モデル切替中...";
      await fetch("/api/settings", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ agy_model: mId }),
      });
      metaText.textContent = "モデル切替完了";
    });

    speedRange.addEventListener("input", () => {
      prefs.speed = Number(speedRange.value);
      speedVal.textContent = `${prefs.speed.toFixed(2)}x`;
      localStorage.setItem("speed", String(prefs.speed));
      sendWsConfig();
    });
    speedRange.addEventListener("change", () => {
      fetch("/api/settings", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ speed_scale: prefs.speed }),
      }).catch(() => {});
    });

    nightToggle.addEventListener("click", () => {
      prefs.night = !prefs.night;
      applyNight();
    });

    resetBtn.addEventListener("click", async () => {
      stopPlaybackOnly();
      await fetch("/api/reset", { method: "POST" });
      historyItems = [];
      hasChatted = false;
      renderChatFeed();
      replayBtn.style.display = "none";
      lastReplyAudios = [];
      applyCharacterVisual();
      closeSheets();
      setCallState("idle");
      metaText.textContent = "リセットしました";
    });

    if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
    async function requestWakeLock() {
      if (!("wakeLock" in navigator)) return;
      try { await navigator.wakeLock.request("screen"); } catch (_) {}
    }
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") requestWakeLock();
    });
    requestWakeLock();
  </script>
</body>
